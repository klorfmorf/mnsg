name: Mystical Ninja Starring Goemon (USA)
sha1: 6ea0ed71032ce08fc2745f412d84936382197494

options:
  basename: mnsg
  compiler: IDO
  platform: n64

  header_encoding: ASCII

  target_path: config/usa/baserom.decompressed.z64
  ld_script_path: .splat/usa/mnsg.ld
  elf_path: build/usa/mnsg.elf
  base_path: ../../

  undefined_funcs_auto_path: .splat/usa/undefined_funcs_auto.ld
  undefined_syms_auto_path: .splat/usa/undefined_syms_auto.ld

  symbol_addrs_path:
    - config/usa/symbol_addrs/symbol_addrs.txt
  reloc_addrs_path:
    - config/usa/reloc_addrs/reloc_addrs.txt
  
  asm_path: asm/usa
  src_path: src
  build_path: build/usa
  asset_path: bin/usa
  # extensions_path: tools/splat_ext

  # Uncomment the line below when creating an ELF file for dumping N64Recomp symbols or analyzing in Ghidra
  asm_nonmatching_label_macro: ""

  symbol_name_format: $VRAM_$ROM

  find_file_boundaries: True
  migrate_rodata_to_functions: True
  disassemble_all: True
  rodata_string_guesser_level: 2
  gfx_ucode: f3dex

segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80000400
    symbol_name_format: $VRAM
    subalign: 16
    subsegments:
    - [0x1000, hasm, entry]

  - name: main
    dir: system
    type: code
    start: 0x1050
    vram: 0x80000450
    symbol_name_format: $VRAM
    bss_size: 0x14D380
    subalign: 16
    subsegments:
    - [0x1050, c, main]
    - [0x2410, c, is64] # IS64 Debugger
