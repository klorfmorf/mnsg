[project]
name = "mnsg"
version = "0.1.0"
description = "A work-in-progress decompilation of Mystical Ninja Starring Goemon for the Nintendo 64."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "cxxfilt>=0.3.0",
    "levenshtein>=0.27.3",
    "lzkn64>=0.2.0",
    "ninja-syntax>=1.7.2",
    "pycparser>=2.23",
    "pyyaml>=6.0.3",
    "splat64[mips]>=0.32.3,<1.0.0",
    "toml>=0.10.2",
    "watchdog>=6.0.0",
]

[tool.uv]
package = false
